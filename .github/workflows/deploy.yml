name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  WRANGLER_SEND_METRICS: "false"
jobs:
  production:
    runs-on: ubuntu-latest
    # A human approves each run: the `production` environment has required reviewers
    # (docs/ops/deploy.md). Never remove this line.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { chromium: "true" }
      - name: deploy inkly
        id: deploy
        run: |
          scripts/deploy-production.sh | tee "$RUNNER_TEMP/deploy.log"
          echo "url=$(sed -n 's/^url: //p' "$RUNNER_TEMP/deploy.log")" >> "$GITHUB_OUTPUT"
      - name: verify production
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: .claude/skills/verify-app/run.sh --url "$URL" J-000
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verify-app
          path: artifacts/verify-app/
          if-no-files-found: ignore
