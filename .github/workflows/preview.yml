name: preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  # `preview` is a check auto-merge requires (docs/ops/auto-merge.md): every journey and the
  # tenancy attacks against this PR's own Worker, D1, R2 and KV on real Cloudflare.
  preview:
    # Secrets are not available to fork PRs; previews are for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            # Fails rather than skips: auto-merge must never read an unverified preview as green.
            echo "❌ preview cannot run: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (scripts/setup-cloudflare-secrets.sh)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm i --frozen-lockfile
      # J-009 and J-010 validate saved and annotated PDFs with verify-pdf.
      - if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: deploy inkly-pr-${{ github.event.pull_request.number }}
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        run: |
          secret_file="$RUNNER_TEMP/preview-secret"
          PREVIEW_SECRET_FILE="$secret_file" .claude/skills/cf-deploy-preview/run.sh "$PR" | tee "$RUNNER_TEMP/deploy.log"
          echo "::add-mask::$(cat "$secret_file")"
          echo "url=$(sed -n 's/^url: //p' "$RUNNER_TEMP/deploy.log")" >> "$GITHUB_OUTPUT"
      # T3.5: a fresh Document seal key pair per preview, held only in this step's memory.
      - name: seal key for inkly-pr-${{ github.event.pull_request.number }}
        if: steps.secrets.outputs.ready == 'true'
        run: |
          pair="$(node --disable-warning=ExperimentalWarning scripts/seal-key.mjs --json)"
          for name in SEAL_PRIVATE_KEY SEAL_CERTIFICATE; do
            jq -r --arg n "$name" '.[$n]' <<<"$pair" |
              pnpm --filter @inkly/api exec wrangler secret put "$name" -c wrangler.preview.json >/dev/null
          done
          echo "seal key: set (certificate at /api/seal-certificate)"
      - name: list resources (exactly one of each)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          .claude/skills/cf-deploy-preview/run.sh --list "$PR" | tee "$RUNNER_TEMP/resources"
          for kind in worker d1 r2 kv queue container; do
            n="$(grep -c "^$kind " "$RUNNER_TEMP/resources" || true)"
            [ "$n" = "1" ] || { echo "expected one $kind, found $n"; exit 1; }
          done
      # #72: the Worker's own logs for the run. Each API request logs request_start and
      # request_end (workers/api/src/request-log.ts), so one that never answered shows a
      # start with no end; the tail event's `outcome` says how its invocation ended.
      - name: start wrangler tail
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          nohup pnpm --filter @inkly/api exec wrangler tail "inkly-pr-$PR" --format json \
            > "$GITHUB_WORKSPACE/artifacts/tail.jsonl" 2> "$GITHUB_WORKSPACE/artifacts/tail.stderr" &
          echo $! > "$RUNNER_TEMP/tail.pid"
          # Tail needs a few seconds to attach before the first journey's requests.
          sleep 10
      - name: verify preview
        if: steps.secrets.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          TEST_HOOKS_SECRET="$(cat "$RUNNER_TEMP/preview-secret")"
          export TEST_HOOKS_SECRET
          pnpm --filter @inkly/testing exec playwright install --with-deps chromium
          .claude/skills/verify-app/run.sh --url "$URL" --all
          .claude/skills/verify-tenancy/run.sh --url "$URL"
      # Reported, not gating: on real Cloudflare, split is over the 3 s bound on main today (#54).
      # The ci.yml verify-perf job still gates the in-Worker ops.
      - name: verify-perf on the preview (report only, #54)
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          TEST_HOOKS_SECRET="$(cat "$RUNNER_TEMP/preview-secret")"
          export TEST_HOOKS_SECRET
          .claude/skills/verify-perf/run.sh --url "$URL"
      - name: stop wrangler tail
        if: always() && steps.secrets.outputs.ready == 'true'
        run: |
          # The tail runs under pnpm: stop the whole process group, then let it flush.
          if [ -f "$RUNNER_TEMP/tail.pid" ]; then
            pkill -TERM -P "$(cat "$RUNNER_TEMP/tail.pid")" || true
            kill "$(cat "$RUNNER_TEMP/tail.pid")" 2>/dev/null || true
            sleep 2
          fi
          wc -c artifacts/tail.jsonl || true
          node scripts/tail-summary.mjs artifacts/tail.jsonl || true
      - name: upload verify-app artifacts
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-verify-app
          path: |
            artifacts/verify-app/
            artifacts/tail.jsonl
            artifacts/tail.stderr
          if-no-files-found: ignore
      - name: comment preview URL
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- inkly-preview -->";
            const body = `${marker}\nPreview: ${process.env.URL}\n\nCommit ${context.payload.pull_request.head.sha.slice(0, 7)}: \`/health\` 200, verify-app (every journey) and verify-tenancy passed against it.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
