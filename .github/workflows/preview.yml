name: preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  # `preview` is a check auto-merge requires (docs/ops/auto-merge.md): every journey and the
  # tenancy attacks against this PR's own Worker, D1, R2 and KV on real Cloudflare.
  preview:
    # Secrets are not available to fork PRs; previews are for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            # Fails rather than skips: auto-merge must never read an unverified preview as green.
            echo "❌ preview cannot run: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (scripts/setup-cloudflare-secrets.sh)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm i --frozen-lockfile
      # J-009 and J-010 validate saved and annotated PDFs with verify-pdf.
      - if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: deploy inkly-pr-${{ github.event.pull_request.number }}
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        run: |
          secret_file="$RUNNER_TEMP/preview-secret"
          PREVIEW_SECRET_FILE="$secret_file" .claude/skills/cf-deploy-preview/run.sh "$PR" | tee "$RUNNER_TEMP/deploy.log"
          echo "::add-mask::$(cat "$secret_file")"
          echo "url=$(sed -n 's/^url: //p' "$RUNNER_TEMP/deploy.log")" >> "$GITHUB_OUTPUT"
      - name: list resources (exactly one of each)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          .claude/skills/cf-deploy-preview/run.sh --list "$PR" | tee "$RUNNER_TEMP/resources"
          for kind in worker d1 r2 kv queue container; do
            n="$(grep -c "^$kind " "$RUNNER_TEMP/resources" || true)"
            [ "$n" = "1" ] || { echo "expected one $kind, found $n"; exit 1; }
          done
      - name: verify preview
        if: steps.secrets.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          TEST_HOOKS_SECRET="$(cat "$RUNNER_TEMP/preview-secret")"
          export TEST_HOOKS_SECRET
          pnpm --filter @inkly/testing exec playwright install --with-deps chromium
          .claude/skills/verify-app/run.sh --url "$URL" --all
          .claude/skills/verify-tenancy/run.sh --url "$URL"
      # Reported, not gating: on real Cloudflare, split is over the 3 s bound on main today (#54).
      # The ci.yml verify-perf job still gates the in-Worker ops.
      - name: verify-perf on the preview (report only, #54)
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          TEST_HOOKS_SECRET="$(cat "$RUNNER_TEMP/preview-secret")"
          export TEST_HOOKS_SECRET
          .claude/skills/verify-perf/run.sh --url "$URL"
      - name: upload verify-app artifacts
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-verify-app
          path: artifacts/verify-app/
          if-no-files-found: ignore
      - name: comment preview URL
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- inkly-preview -->";
            const body = `${marker}\nPreview: ${process.env.URL}\n\nCommit ${context.payload.pull_request.head.sha.slice(0, 7)}: \`/health\` 200, verify-app (every journey) and verify-tenancy passed against it.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
