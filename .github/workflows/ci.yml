name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: "false"
# Each job is one required status check on main (docs/ops/branch-protection.md).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm lint:fixtures
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { pdf-tools: "true" }
      - run: pnpm test
  verify-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { pdf-tools: "true" }
      - run: .claude/skills/verify-pdf/run.sh --corpus fixtures/pdfs
  verify-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { pdf-tools: "true" }
      - run: .claude/skills/verify-perf/run.sh
      - run: .claude/skills/verify-perf/run.sh --self-test
  verify-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { chromium: "true" }
      - run: .claude/skills/verify-app/run.sh --self-test
      - run: .claude/skills/verify-app/run.sh J-000 J-001 J-002 J-003 J-004 J-005 J-006 J-008
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-app
          path: artifacts/verify-app/
          if-no-files-found: ignore
  verify-tenancy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: .claude/skills/verify-tenancy/run.sh
      - run: .claude/skills/verify-tenancy/run.sh --self-test
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: pnpm audit --audit-level high
  prod-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: node scripts/check-prod-config.mjs
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # One PASS/FAIL comment per PR, updated in place on every push (T1.7, token-free).
  verdict:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs:
      [
        check,
        test,
        verify-pdf,
        verify-perf,
        verify-app,
        verify-tenancy,
        audit,
        prod-config,
        secrets,
      ]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = Object.entries(JSON.parse(process.env.NEEDS));
            const pass = needs.every(([, job]) => job.result === "success");
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rows = needs.map(([name, job]) => `| \`${name}\` | ${job.result === "success" ? "pass" : job.result} |`);
            const marker = "<!-- inkly-verifier -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Verifier on ${sha}**`,
              "",
              `Verdict: ${pass ? "PASS" : "FAIL"}`,
              "",
              "| CI job | Result |",
              "|--------|--------|",
              ...rows,
              "",
              `[Workflow run](${run})`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
            if (!pass) core.setFailed("a CI job did not pass");
