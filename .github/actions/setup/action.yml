name: setup
description: Node, pnpm, workspace install, and optional PDF tools and Chromium
inputs:
  pdf-tools:
    description: Install qpdf and poppler-utils
    default: "false"
  chromium:
    description: Install Playwright Chromium
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with: { node-version-file: .nvmrc, cache: pnpm }
    - if: inputs.pdf-tools == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
    - shell: bash
      run: pnpm i --frozen-lockfile
    - if: inputs.chromium == 'true'
      shell: bash
      run: pnpm --filter @inkly/testing exec playwright install --with-deps chromium
