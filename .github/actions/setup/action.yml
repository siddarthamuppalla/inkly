name: setup
description: Node, pnpm, workspace install, and optional PDF tools and Chromium
inputs:
  pdf-tools:
    description: Install qpdf, poppler-utils, ghostscript and pyHanko
    default: "false"
  chromium:
    description: Install Playwright Chromium
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with: { node-version-file: .nvmrc, cache: pnpm }
    - if: inputs.pdf-tools == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils ghostscript
    - if: inputs.pdf-tools == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: .claude/skills/verify-pdf/requirements.txt
    - if: inputs.pdf-tools == 'true'
      shell: bash
      run: pip install -r .claude/skills/verify-pdf/requirements.txt && pyhanko --version
    - shell: bash
      run: pnpm i --frozen-lockfile
    - if: inputs.chromium == 'true'
      shell: bash
      run: pnpm --filter @inkly/testing exec playwright install --with-deps chromium
